<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ FotbollsMatte 3D - Lär dig matte med fotboll!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="game-container"></div>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="logo">
                <h1>⚽ FotbollsMatte 3D</h1>
                <p class="tagline">Skjut mål genom att lösa mattetal!</p>
            </div>
            
            <div class="difficulty-select">
                <h3>Välj svårighetsgrad:</h3>
                <button class="difficulty-btn" data-level="easy">
                    <span class="icon">🥉</span>
                    <span class="text">Ungdomslag</span>
                    <span class="desc">Addition & Subtraktion</span>
                </button>
                <button class="difficulty-btn" data-level="medium">
                    <span class="icon">🥈</span>
                    <span class="text">Allsvenskan</span>
                    <span class="desc">Multiplikation</span>
                </button>
                <button class="difficulty-btn" data-level="hard">
                    <span class="icon">🥇</span>
                    <span class="text">Champions League</span>
                    <span class="desc">Blandade uppgifter</span>
                </button>
            </div>
            
            <div class="controls-info">
                <p>🖱️ Dra för att rotera kameran</p>
            </div>
        </div>

        <!-- Game HUD -->
        <div id="game-hud" class="screen">
            <div class="hud-top">
                <div class="score-board">
                    <div class="team home">
                        <span class="team-name">DU</span>
                        <span id="player-score" class="score">0</span>
                    </div>
                    <div class="vs">-</div>
                    <div class="team away">
                        <span class="team-name">MÅLVAKT</span>
                        <span id="opponent-score" class="score">0</span>
                    </div>
                </div>
                <div class="timer-container">
                    <span class="timer-icon">⏱️</span>
                    <span id="timer">90</span>'
                </div>
                <div class="question-counter">
                    Fråga <span id="current-question">1</span>/<span id="total-questions">10</span>
                </div>
            </div>

            <div class="question-panel">
                <div class="player-badge">
                    <span id="current-player"></span>
                </div>
                <div class="question-box">
                    <p id="question-text"></p>
                </div>
                <div class="answer-section">
                    <input type="number" id="answer-input" placeholder="Svar..." autofocus>
                    <button id="submit-btn">SKJUT! ⚽</button>
                </div>
            </div>

            <div id="feedback" class="feedback"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-content">
                <div id="result-animation" class="result-animation"></div>
                <h2 id="result-title"></h2>
                <div class="final-score">
                    <span id="final-player-score">0</span>
                    <span class="separator">-</span>
                    <span id="final-opponent-score">0</span>
                </div>
                <p id="result-message"></p>
                
                <div class="stats">
                    <div class="stat">
                        <span class="icon">✅</span>
                        <span id="correct-count">0</span>
                        <span class="label">Rätt</span>
                    </div>
                    <div class="stat">
                        <span class="icon">❌</span>
                        <span id="wrong-count">0</span>
                        <span class="label">Fel</span>
                    </div>
                    <div class="stat">
                        <span class="icon">🎯</span>
                        <span id="accuracy">0%</span>
                        <span class="label">Träff</span>
                    </div>
                </div>

                <div class="result-buttons">
                    <button id="play-again-btn" class="primary-btn">Spela igen ⚽</button>
                    <button id="home-btn" class="secondary-btn">Startsidan 🏠</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Game Scripts -->
    <script src="stadium3d.js"></script>
    <script src="game.js"></script>
</body>
</html>
